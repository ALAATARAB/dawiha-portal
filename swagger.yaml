info:
  title: 'Dawiha: development environment'
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    MeEntity:
      type: object
      properties:
        id:
          type: number
        full_name:
          type: string
        phone_number:
          type: string
        country_code:
          type: string
        birth_date:
          format: date-time
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        fcm_token:
          type: string
        is_verified:
          type: boolean
        role:
          type: string
          enum:
            - USER
            - PROVIDER
            - ADMIN
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - full_name
        - phone_number
        - country_code
        - is_verified
        - role
        - created_at
        - updated_at
    HttpExceptionModel:
      type: object
      properties:
        statusCode:
          type: number
        message:
          type: string
        fields:
          type: array
          items:
            type: string
      required:
        - statusCode
        - message
        - fields
    UpdateProfileDto:
      type: object
      properties:
        full_name:
          type: string
        fcm_token:
          type: string
        birth_date:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
