          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        is_verified:
          type: boolean
        role:
          type: string
          enum:
            - USER
            - PROVIDER
            - ADMIN
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
